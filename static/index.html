<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stay — book places to live</title>
<style>
  :root{
    --coral:#FF385C;
    --coral-dark:#E00B41;
    --ink:#222222;
    --muted:#717171;
    --line:#DDDDDD;
    --line-soft:#EBEBEB;
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --shadow:0 6px 20px rgba(0,0,0,.08);
    --radius:12px;
    --green:#E7F7EC;
    --green-ink:#1B7A3E;
    --gray:#F0F0F0;
    --field-bg:#FFFFFF;
    --hover:#F7F7F7;
    --hover-soft:#F1F1F1;
  }
  [data-theme="dark"]{
    --coral:#FF5A76;
    --coral-dark:#FF385C;
    --ink:#EDEDED;
    --muted:#9A9A9A;
    --line:#3A3A3A;
    --line-soft:#2A2A2A;
    --bg:#161616;
    --surface:#1E1E1E;
    --shadow:0 6px 20px rgba(0,0,0,.4);
    --green:#16321F;
    --green-ink:#5FD98A;
    --gray:#2A2A2A;
    --field-bg:#242424;
    --hover:#262626;
    --hover-soft:#2E2E2E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    transition:background .2s,color .2s;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .bar{
    max-width:1180px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;gap:14px;
  }
  .logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--coral);cursor:pointer}
  .logo span{color:var(--ink)}
  .spacer{flex:1}
  .whoami{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:999px;
    padding:6px 8px 6px 16px;font-size:14px;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:var(--bg);
    display:grid;place-items:center;font-size:13px;font-weight:600;
  }
  .theme-toggle{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;font-size:16px;transition:.15s;
  }
  .theme-toggle:hover{background:var(--hover)}
  .btn{border-radius:8px;padding:11px 18px;font-size:15px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-ghost{border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--hover)}
  .btn-quiet{color:var(--muted);font-weight:500;text-decoration:underline}
  .btn-quiet:hover{color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:8px 14px;font-size:14px}

  /* ---------- tabs ---------- */
  nav.tabs{
    max-width:1180px;margin:0 auto;padding:0 24px;
    display:flex;gap:28px;overflow-x:auto;
  }
  nav.tabs button{
    padding:16px 0;font-size:15px;font-weight:500;color:var(--muted);
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
  .head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .head p{color:var(--muted);font-size:14px;margin-top:4px}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:20px}
  .back-link:hover{color:var(--ink)}

  .grid{display:grid;gap:28px 20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

  /* ---------- listing card ---------- */
  .card{cursor:pointer}
  .card .photo{
    aspect-ratio:20/19;border-radius:var(--radius);overflow:hidden;
    position:relative;margin-bottom:12px;background-size:cover;background-position:center;
  }
  .card .photo i{position:absolute;inset:0;transition:transform .4s ease}
  .card .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
  .card:hover .photo i,.card:hover .photo img{transform:scale(1.05)}
  .card .price-tag{
    position:absolute;left:12px;bottom:12px;
    background:color-mix(in srgb, var(--surface) 95%, transparent);border-radius:999px;
    padding:6px 12px;font-size:13px;font-weight:600;
  }
  .card h3{font-size:15px;font-weight:600;margin-bottom:2px}
  .card .owner{font-size:14px;color:var(--muted)}
  .card .desc{
    font-size:14px;color:var(--muted);margin:6px 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .actions{display:flex;gap:8px;margin-top:10px}

  /* ---------- booking row ---------- */
  .row{
    display:flex;gap:16px;align-items:center;
    border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;background:var(--surface);
  }
  .row .thumb{width:76px;height:76px;border-radius:8px;flex-shrink:0;overflow:hidden;position:relative}
  .row .thumb i{position:absolute;inset:0}
  .row .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row .info{flex:1;min-width:0}
  .row .info h3{font-size:15px;font-weight:600;margin-bottom:3px}
  .row .info .meta{font-size:14px;color:var(--muted)}
  .row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

  .pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;letter-spacing:.2px}
  .pill.pending{background:#FFF4E5;color:#B26A00}
  .pill.confirmed{background:#E8F5EC;color:#1B7A3E}
  .pill.rejected{background:#FDECEC;color:#B3261E}
  .pill.cancelled{background:#F1F1F1;color:#717171}
  [data-theme="dark"] .pill.pending{background:#3A2A12;color:#E0A050}
  [data-theme="dark"] .pill.confirmed{background:#16321F;color:#5FD98A}
  [data-theme="dark"] .pill.rejected{background:#3A1A18;color:#F08078}
  [data-theme="dark"] .pill.cancelled{background:#2A2A2A;color:#9A9A9A}

  /* ---------- states ---------- */
  .empty{border:1px solid var(--line-soft);border-radius:var(--radius);padding:56px 24px;text-align:center;background:var(--surface)}
  .empty h3{font-size:17px;font-weight:600;margin-bottom:6px}
  .empty p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .skeleton{border-radius:var(--radius);background:var(--hover-soft);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* ---------- modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:100;overflow-y:auto}
  .modal{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
    animation:pop .18s ease-out;
  }
  .modal.wide{max-width:600px}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .modal .m-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .modal .m-head h2{font-size:16px;font-weight:600;flex:1;text-align:center}
  .modal .m-body{padding:22px 24px}
  .modal .m-foot{padding:0 24px 24px}
  .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px}
  .x:hover{background:var(--hover-soft)}

  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .field{margin-bottom:16px}
  .field input,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field-bg);
    padding:12px 14px;outline:none;transition:.15s;
  }
  .field input:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .field textarea{resize:vertical;min-height:88px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .switch{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
  .full{width:100%;display:block;text-align:center}

  .summary{border-top:1px solid var(--line-soft);margin-top:6px;padding-top:14px;font-size:14px;display:flex;justify-content:space-between}
  .summary strong{font-size:16px}

  /* ---------- photo picker ---------- */
  .photo-picker{
    border:1px dashed var(--line);border-radius:var(--radius);
    aspect-ratio:16/9;position:relative;overflow:hidden;
    display:grid;place-items:center;cursor:pointer;margin-bottom:16px;
    background:var(--field-bg);transition:.15s;
  }
  .photo-picker:hover{border-color:var(--ink)}
  .photo-picker img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo-picker .hint{font-size:13px;color:var(--muted);text-align:center;padding:0 16px}
  .photo-picker input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .photo-picker .swap{
    position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;pointer-events:none;
  }

  /* ---------- listing detail page ---------- */
  .detail{max-width:760px;margin:0 auto}
  .detail-photo{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;position:relative;margin-bottom:20px}
  .detail-photo i{position:absolute;inset:0}
  .detail-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .detail-title{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.4px}
  .detail-owner{font-size:15px;color:var(--muted);margin-bottom:18px}
  .detail-desc{font-size:15px;line-height:1.6;margin-bottom:24px}
  .detail-price{font-size:18px;font-weight:700;margin-bottom:18px}
  .detail-price span{font-weight:400;color:var(--muted);font-size:15px}
  .detail-cols{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
  .detail-book{border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:sticky;top:90px;background:var(--surface);box-shadow:var(--shadow)}
  @media(max-width:720px){.detail-cols{grid-template-columns:1fr}.detail-book{position:static}}

  /* ---------- calendar ---------- */
  .cal{margin-bottom:16px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head strong{font-size:14px;font-weight:600}
  .cal-nav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
  .cal-nav:hover{background:var(--hover-soft)}
  .cal-nav:disabled{opacity:.3;cursor:not-allowed}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-dow{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
  .cal-day{
    aspect-ratio:1;display:grid;place-items:center;border-radius:8px;
    font-size:13px;cursor:pointer;user-select:none;background:var(--green);color:var(--green-ink);
  }
  .cal-day.blank{background:none;cursor:default}
  .cal-day.past{background:none;color:var(--muted);opacity:.4;cursor:not-allowed}
  .cal-day.booked{background:var(--gray);color:var(--muted);cursor:not-allowed;text-decoration:line-through}
  .cal-day.sel{background:var(--ink);color:var(--bg)}
  .cal-day.range{background:color-mix(in srgb, var(--coral) 22%, transparent);color:var(--coral)}
  .cal-legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* ---------- toast ---------- */
  #toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{
    background:var(--ink);color:var(--bg);border-radius:10px;
    padding:13px 18px;font-size:14px;max-width:400px;
    box-shadow:var(--shadow);animation:pop .18s ease-out;
  }
  .toast.bad{background:#B3261E;color:#fff}
  .toast.good{background:#1B7A3E;color:#fff}

  @media(max-width:640px){
    .bar{padding:12px 16px}
    main{padding:24px 16px 60px}
    nav.tabs{padding:0 16px}
    .row{flex-wrap:wrap}
    .row .side{width:100%;align-items:flex-start;flex-direction:row;justify-content:space-between}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--coral);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" id="logo">stay<span>.</span></div>
    <div class="spacer"></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    <div id="authArea"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>
<div id="modalHost"></div>
<div id="toasts"></div>

<script>
const API = location.port === '8000' ? '' : 'http://127.0.0.1:8000';

const state = {
  token: localStorage.getItem('stay_token') || null,
  me: null,
  tab: 'explore',
  listings: [],
  tripsGuest: [],
  tripsOwner: [],
  loading: false,
  route: {name: 'home', listingId: null},  // 'home' or 'listing'
};

/* ============ theme ============ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('stay_theme', theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('stay_theme') || 'light');
document.getElementById('themeToggle').onclick = toggleTheme;

/* ============ api ============ */
async function api(path, {method='GET', body, auth=true, formData=false} = {}) {
  const headers = {};
  if (body && !formData) headers['Content-Type'] = 'application/json';
  if (auth && state.token) headers['Authorization'] = 'Bearer ' + state.token;

  const res = await fetch(API + path, {
    method, headers,
    body: formData ? body : (body ? JSON.stringify(body) : undefined),
  });

  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }

  if (!res.ok) {
    if (res.status === 401 && auth) logout(true);
    throw new Error(readError(data, res.status));
  }
  return data;
}

function readError(data, status) {
  const d = data && data.detail;
  if (typeof d === 'string') return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).slice(1).join('.')}: ${e.msg}`).join('; ');
  return 'Something went wrong (status ' + status + ')';
}

/* ============ helpers ============ */
const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind='') {
  const el = $(`<div class="toast ${kind}">${esc(msg)}</div>`);
  document.getElementById('toasts').append(el);
  setTimeout(() => el.remove(), 4000);
}

function shade(id) {
  const hue = (Number(id) * 47) % 360;
  return `background:linear-gradient(140deg,hsl(${hue} 62% 72%),hsl(${(hue+40)%360} 58% 55%))`;
}
function photoUrl(url) { return url ? (url.startsWith('http') ? url : API + url) : null; }
function coverHTML(l) {
  const src = photoUrl(l.image_url);
  return src ? `<img src="${esc(src)}" alt="">` : `<i style="${shade(l.id)}"></i>`;
}
const money = (n) => '$' + new Intl.NumberFormat('en-US').format(Math.round(n));
function fmtDate(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function nights(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
const STATUS_EN = {pending:'Awaiting host', confirmed:'Confirmed', rejected:'Declined', cancelled:'Cancelled'};

/* ============ date utils (timezone-safe) ============ */
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function isBefore(a, b) { return a < b; }

/* ============ availability ============ */
async function fetchBookedSet(listingId) {
  const periods = await api(`/listings/${listingId}/availability`, {auth:false});
  const booked = new Set();
  for (const p of periods) {
    let cur = p.check_in;
    while (isBefore(cur, p.check_out)) { booked.add(cur); cur = addDays(cur, 1); }
  }
  return booked;
}

/* ============ routing ============ */
function parseLocation() {
  const m = location.pathname.match(/^\/(\d+)$/);
  return m ? {name: 'listing', listingId: Number(m[1])} : {name: 'home', listingId: null};
}
// navigate without reload; push=true adds a history entry
function go(route, push=true) {
  state.route = route;
  const url = route.name === 'listing' ? `/${route.listingId}` : '/';
  if (push) history.pushState(route, '', url);
  render();
}
window.addEventListener('popstate', (e) => {
  // browser back/forward — read the URL, re-render, don't push a new entry
  state.route = e.state || parseLocation();
  render();
});

/* ============ auth ============ */
async function loadMe() {
  if (!state.token) { state.me = null; return; }
  try { state.me = await api('/auth/me'); } catch { state.me = null; }
}
function logout(silent) {
  state.token = null; state.me = null;
  localStorage.removeItem('stay_token');
  if (!silent) toast('Signed out');
  go({name:'home', listingId:null});
}

/* ============ modal ============ */
function closeModal() { document.getElementById('modalHost').innerHTML = ''; }
function openModal(title, bodyHTML, footHTML, wide=false) {
  const host = document.getElementById('modalHost');
  host.innerHTML = '';
  const back = $(`
    <div class="backdrop">
      <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        <div class="m-head">
          <button class="x" data-close aria-label="Close">✕</button>
          <h2>${esc(title)}</h2>
          <span style="width:32px"></span>
        </div>
        <div class="m-body">${bodyHTML}</div>
        ${footHTML ? `<div class="m-foot">${footHTML}</div>` : ''}
      </div>
    </div>`);
  back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) closeModal(); });
  host.append(back);
  const first = back.querySelector('input:not([type=file]),textarea');
  if (first) first.focus();
  return back;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============ auth modal ============ */
function authModal(mode = 'login') {
  const isLogin = mode === 'login';
  const m = openModal(isLogin ? 'Log in' : 'Sign up', `
    ${isLogin ? '' : `
    <div class="field"><label for="f-nick">Display name</label>
      <input id="f-nick" placeholder="What guests will see" autocomplete="nickname"></div>`}
    <div class="field"><label for="f-email">Email</label>
      <input id="f-email" type="email" placeholder="you@mail.com" autocomplete="email"></div>
    <div class="field"><label for="f-pass">Password</label>
      <input id="f-pass" type="password" placeholder="At least 5 characters" autocomplete="${isLogin ? 'current-password' : 'new-password'}"></div>
    <div class="switch">${isLogin ? "Don't have an account?" : 'Already registered?'}
      <button class="btn-quiet" id="f-swap">${isLogin ? 'Sign up' : 'Log in'}</button></div>
  `, `<button class="btn btn-primary full" id="f-go">${isLogin ? 'Log in' : 'Create account'}</button>`);

  m.querySelector('#f-swap').onclick = () => authModal(isLogin ? 'register' : 'login');

  const go2 = m.querySelector('#f-go');
  go2.onclick = async () => {
    const email = m.querySelector('#f-email').value.trim();
    const password = m.querySelector('#f-pass').value;
    const nick = isLogin ? null : m.querySelector('#f-nick').value.trim();
    if (!email || !password) return toast('Enter your email and password', 'bad');
    if (password.length < 5) return toast('Password must be at least 5 characters', 'bad');
    if (!isLogin && !nick) return toast('Enter a display name', 'bad');

    go2.disabled = true; go2.textContent = 'One moment…';
    try {
      if (!isLogin) await api('/auth/registration', {method:'POST', auth:false, body:{nick, email, password}});
      const res = await api('/auth/login', {method:'POST', auth:false, body:{email, password}});
      const token = res['access token'] || res['access_token'] || res.token;
      if (!token) throw new Error('The server did not return a token');
      state.token = token;
      localStorage.setItem('stay_token', token);
      await loadMe();
      closeModal();
      toast(isLogin ? `Welcome back, ${state.me?.nick || ''}` : 'Account created', 'good');
      await refresh();
    } catch (e) {
      toast(e.message, 'bad');
      go2.disabled = false; go2.textContent = isLogin ? 'Log in' : 'Create account';
    }
  };
}
function requireAuth() { if (!state.me) { authModal('login'); return false; } return true; }

/* ============ listing create/edit modal ============ */
function listingModal(existing) {
  const edit = !!existing;
  let pendingPhoto = null;
  const m = openModal(edit ? 'Edit listing' : 'New listing', `
    <div class="photo-picker" id="l-picker">
      ${existing?.image_url ? `<img src="${esc(photoUrl(existing.image_url))}" alt="">`
        : `<span class="hint">Click to add a cover photo<br>(optional, add it later too)</span>`}
      <input type="file" id="l-photo" accept="image/*">
      ${existing?.image_url ? `<span class="swap">Change photo</span>` : ''}
    </div>
    <div class="field"><label for="l-name">Title</label>
      <input id="l-name" placeholder="Studio by the sea" value="${esc(existing?.name || '')}"></div>
    <div class="field"><label for="l-desc">Description</label>
      <textarea id="l-desc" placeholder="What a guest should know">${esc(existing?.description || '')}</textarea></div>
    <div class="field"><label for="l-price">Price per night</label>
      <input id="l-price" type="number" min="1" step="1" placeholder="120" value="${existing?.price ?? ''}"></div>
  `, `<button class="btn btn-primary full" id="l-go">${edit ? 'Save changes' : 'Publish listing'}</button>`);

  const picker = m.querySelector('#l-picker');
  const fileInput = m.querySelector('#l-photo');
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (edit) {
      const fd = new FormData(); fd.append('photo', file);
      try {
        await api(`/listings/${existing.id}/photo`, {method:'POST', body:fd, formData:true});
        toast('Photo updated', 'good');
        await refresh();
        const fresh = state.listings.find(l => l.id === existing.id);
        if (fresh) existing = fresh;
        picker.querySelectorAll('img').forEach(i => i.remove());
        picker.querySelector('.hint')?.remove();
        picker.insertAdjacentHTML('afterbegin', `<img src="${esc(photoUrl(existing.image_url))}" alt="">`);
        if (!picker.querySelector('.swap')) picker.insertAdjacentHTML('beforeend', `<span class="swap">Change photo</span>`);
      } catch (e) { toast(e.message, 'bad'); }
    } else {
      pendingPhoto = file;
      const reader = new FileReader();
      reader.onload = () => {
        picker.querySelectorAll('img').forEach(i => i.remove());
        picker.querySelector('.hint')?.remove();
        picker.insertAdjacentHTML('afterbegin', `<img src="${reader.result}" alt="">`);
        if (!picker.querySelector('.swap')) picker.insertAdjacentHTML('beforeend', `<span class="swap">Change photo</span>`);
      };
      reader.readAsDataURL(file);
    }
  };

  const go2 = m.querySelector('#l-go');
  go2.onclick = async () => {
    const name = m.querySelector('#l-name').value.trim();
    const description = m.querySelector('#l-desc').value.trim();
    const price = Number(m.querySelector('#l-price').value);
    if (name.length < 4) return toast('Title must be at least 4 characters', 'bad');
    if (!description) return toast('Add a description', 'bad');
    if (!price || price <= 0) return toast('Price must be greater than zero', 'bad');

    go2.disabled = true; go2.textContent = 'One moment…';
    try {
      let listingId = existing?.id;
      if (edit) {
        await api(`/listings/${existing.id}`, {method:'PATCH', body:{name, description, price}});
      } else {
        const created = await api('/listings/', {method:'POST', body:{name, description, price}});
        listingId = created.id;
        if (pendingPhoto) {
          const fd = new FormData(); fd.append('photo', pendingPhoto);
          await api(`/listings/${listingId}/photo`, {method:'POST', body:fd, formData:true});
        }
      }
      closeModal();
      toast(edit ? 'Listing updated' : 'Listing published', 'good');
      await refresh();
    } catch (e) {
      toast(e.message, 'bad');
      go2.disabled = false; go2.textContent = edit ? 'Save changes' : 'Publish listing';
    }
  };
}

/* ============ calendar widget ============ */
function renderCalendar(host, viewDate, bookedSet, range, onPick, onNav) {
  const today = todayISO();
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US', {month:'long', year:'numeric'});

  const curY = Number(today.slice(0,4)), curM = Number(today.slice(5,7)) - 1;
  const inPastMonth = (year < curY) || (year === curY && month <= curM);

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-day blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast = iso < today;
    const isBooked = bookedSet.has(iso);
    let cls = 'cal-day';
    if (isPast) cls += ' past';
    else if (isBooked) cls += ' booked';
    if (range.start && iso === range.start) cls += ' sel';
    if (range.end && iso === range.end) cls += ' sel';
    if (range.start && range.end && iso > range.start && iso < range.end) cls += ' range';
    const clickable = !isPast && !isBooked;
    cells += `<div class="${cls}" ${clickable ? `data-day="${iso}"` : ''}>${d}</div>`;
  }

  host.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" data-nav="-1" ${inPastMonth ? 'disabled' : ''}>‹</button>
      <strong>${monthLabel}</strong>
      <button class="cal-nav" data-nav="1">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">S</div><div class="cal-dow">M</div><div class="cal-dow">T</div>
      <div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div>
      ${cells}
    </div>
    <div class="cal-legend">
      <span><i style="background:var(--green)"></i>Available</span>
      <span><i style="background:var(--gray)"></i>Booked</span>
      <span><i style="background:var(--ink)"></i>Selected</span>
    </div>`;

  host.querySelectorAll('[data-day]').forEach(el => el.onclick = () => onPick(el.dataset.day));
  host.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => onNav(Number(el.dataset.nav)));
}

/* ============ listing detail page ============ */
async function renderListingDetail(view, listing) {
  const mine = state.me && listing.owner.id === state.me.id;
  view.innerHTML = `
    <a class="back-link" id="back">‹ Back to all stays</a>
    <div class="detail">
      <div class="detail-photo">${coverHTML(listing)}</div>
      <div class="detail-cols">
        <div>
          <div class="detail-title">${esc(listing.name)}</div>
          <div class="detail-owner">${mine ? 'Your listing' : 'Hosted by ' + esc(listing.owner.nick)}</div>
          <p class="detail-desc">${esc(listing.description)}</p>
          <div class="detail-price">${money(listing.price)} <span>/ night</span></div>
          ${mine ? `<div style="display:flex;gap:8px">
              <button class="btn btn-ghost" id="d-edit">Edit</button>
              <button class="btn btn-ghost" id="d-del">Delete</button></div>` : ''}
        </div>
        ${mine ? '' : `
        <div class="detail-book">
          <div class="cal" id="d-cal"><div class="hint" style="text-align:center;padding:20px;color:var(--muted)">Loading availability…</div></div>
          <div class="summary" id="d-sum"><span>Pick check-in and check-out</span><strong>—</strong></div>
          <button class="btn btn-primary full" id="d-go" style="margin-top:14px" disabled>Select dates first</button>
        </div>`}
      </div>
    </div>`;

  view.querySelector('#back').onclick = () => go({name:'home', listingId:null});

  if (mine) {
    view.querySelector('#d-edit').onclick = () => listingModal(listing);
    view.querySelector('#d-del').onclick = () => deleteListing(listing.id, true);
    return;
  }

  const calHost = view.querySelector('#d-cal');
  const sum = view.querySelector('#d-sum');
  const go2 = view.querySelector('#d-go');
  let viewDate = new Date(); viewDate.setDate(1);
  const range = {start:null, end:null};
  let bookedSet = new Set();

  const updateSummary = () => {
    if (range.start && range.end) {
      const n = nights(range.start, range.end);
      sum.innerHTML = `<span>${money(listing.price)} × ${n} night${n>1?'s':''}</span><strong>${money(listing.price*n)}</strong>`;
      go2.disabled = false; go2.textContent = 'Request to book';
    } else if (range.start) {
      sum.innerHTML = `<span>Check-in ${fmtDate(range.start)} — pick check-out</span><strong>—</strong>`;
      go2.disabled = true; go2.textContent = 'Select dates first';
    } else {
      sum.innerHTML = `<span>Pick check-in and check-out</span><strong>—</strong>`;
      go2.disabled = true; go2.textContent = 'Select dates first';
    }
  };
  const rangeHasBookedDay = (s, e) => { let c = s; while (isBefore(c, e)) { if (bookedSet.has(c)) return true; c = addDays(c,1); } return false; };
  const draw = () => renderCalendar(calHost, viewDate, bookedSet, range, onPick, onNav);

  function onPick(iso) {
    if (!range.start || (range.start && range.end)) { range.start = iso; range.end = null; }
    else if (iso <= range.start) { range.start = iso; range.end = null; }
    else if (rangeHasBookedDay(range.start, iso)) { toast('That range crosses a booked date — pick a shorter stay', 'bad'); range.start = iso; range.end = null; }
    else { range.end = iso; }
    updateSummary(); draw();
  }
  function onNav(delta) { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+delta, 1); draw(); }

  try { bookedSet = await fetchBookedSet(listing.id); } catch { toast('Could not load availability', 'bad'); }
  draw(); updateSummary();

  go2.onclick = async () => {
    if (!requireAuth()) return;
    if (!range.start || !range.end) return;
    go2.disabled = true; go2.textContent = 'One moment…';
    try {
      await api('/bookings/', {method:'POST', body:{listing_id: listing.id, check_in: range.start, check_out: range.end}});
      toast('Request sent — waiting on the host', 'good');
      state.tab = 'trips';
      go({name:'home', listingId:null});
      await refresh();
    } catch (e) { toast(e.message, 'bad'); go2.disabled = false; go2.textContent = 'Request to book'; }
  };
}

/* ============ actions ============ */
async function act(fn, okMsg) {
  try { await fn(); toast(okMsg, 'good'); await refresh(); }
  catch (e) { toast(e.message, 'bad'); }
}
const confirmBooking = (id) => act(() => api(`/bookings/${id}/confirm`, {method:'PATCH'}), 'Booking confirmed');
const rejectBooking  = (id) => act(() => api(`/bookings/${id}/reject`,  {method:'PATCH'}), 'Booking declined');
const cancelBooking  = (id) => act(() => api(`/bookings/${id}/cancel`,  {method:'PATCH'}), 'Booking cancelled');
const deleteListing  = (id, goHome) => {
  if (!window.confirm('Delete this listing? This cannot be undone.')) return;
  return act(async () => { await api(`/listings/${id}`, {method:'DELETE'}); if (goHome) go({name:'home', listingId:null}); }, 'Listing deleted');
};

/* ============ data ============ */
async function refresh() {
  state.loading = true; render();
  try {
    const jobs = [api('/listings/', {auth:false}).then(r => state.listings = r || [])];
    if (state.me) {
      jobs.push(api('/bookings/as-guest').then(r => state.tripsGuest = r || []));
      jobs.push(api('/bookings/as-owner').then(r => state.tripsOwner = r || []));
    } else { state.tripsGuest = []; state.tripsOwner = []; }
    await Promise.all(jobs);
  } catch (e) { toast(e.message, 'bad'); }
  finally { state.loading = false; render(); }
}

/* ============ render ============ */
function renderAuthArea() {
  const el = document.getElementById('authArea');
  if (state.me) {
    el.innerHTML = `<div class="whoami"><span>${esc(state.me.nick)}</span>
      <span class="avatar">${esc((state.me.nick || '?')[0].toUpperCase())}</span>
      <button class="btn btn-quiet btn-sm" id="out">Log out</button></div>`;
    el.querySelector('#out').onclick = () => logout();
  } else {
    el.innerHTML = `<button class="btn btn-primary btn-sm" id="in">Log in</button>`;
    el.querySelector('#in').onclick = () => authModal('login');
  }
}

function renderTabs() {
  // tabs only make sense on the home route
  const nav = document.getElementById('tabs');
  if (state.route.name !== 'home') { nav.innerHTML = ''; return; }
  const pending = state.tripsOwner.filter(b => b.status === 'pending').length;
  const tabs = [
    ['explore', 'Explore stays'],
    ['mine',    'Your listings'],
    ['trips',   `Your trips${state.tripsGuest.length ? ' · ' + state.tripsGuest.length : ''}`],
    ['inbox',   `Requests${pending ? ' · ' + pending : ''}`],
  ];
  nav.innerHTML = tabs.map(([k, label]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${esc(label)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.tab;
    if (k !== 'explore' && !requireAuth()) return;
    state.tab = k; render();
  });
}

function skeletonGrid() {
  return `<div class="grid">${'<div><div class="skeleton" style="aspect-ratio:20/19"></div><div class="skeleton" style="height:14px;margin-top:12px;width:70%"></div><div class="skeleton" style="height:14px;margin-top:8px;width:45%"></div></div>'.repeat(8)}</div>`;
}

function listingCard(l) {
  const mine = state.me && l.owner.id === state.me.id;
  return `
    <article class="card" data-listing="${l.id}">
      <div class="photo">${coverHTML(l)}<span class="price-tag">${money(l.price)} / night</span></div>
      <h3>${esc(l.name)}</h3>
      <div class="owner">${mine ? 'Your listing' : 'Hosted by ' + esc(l.owner.nick)}</div>
      <p class="desc">${esc(l.description)}</p>
      <div class="actions">
        ${mine ? `<button class="btn btn-ghost btn-sm" data-edit="${l.id}">Edit</button>
             <button class="btn btn-ghost btn-sm" data-del="${l.id}">Delete</button>`
          : `<button class="btn btn-primary btn-sm" data-open="${l.id}">View</button>`}
      </div>
    </article>`;
}

function bookingRow(b, role) {
  const canCancel = role === 'guest' && (b.status === 'pending' || b.status === 'confirmed');
  const canDecide = role === 'owner' && b.status === 'pending';
  const n = nights(b.check_in, b.check_out);
  return `
    <div class="row">
      <div class="thumb">${coverHTML(b.listing)}</div>
      <div class="info">
        <h3>${esc(b.listing.name)}</h3>
        <div class="meta">${fmtDate(b.check_in)} – ${fmtDate(b.check_out)} · ${n} night${n>1?'s':''} · ${money(b.listing.price*n)}</div>
        ${role === 'owner' ? `<div class="meta">Guest — ${esc(b.guest.nick)}</div>` : ''}
      </div>
      <div class="side">
        <span class="pill ${b.status}">${STATUS_EN[b.status] || b.status}</span>
        <div style="display:flex;gap:8px">
          ${canDecide ? `<button class="btn btn-primary btn-sm" data-confirm="${b.id}">Confirm</button>
                         <button class="btn btn-ghost btn-sm" data-reject="${b.id}">Decline</button>` : ''}
          ${canCancel ? `<button class="btn btn-ghost btn-sm" data-cancel="${b.id}">Cancel</button>` : ''}
        </div>
      </div>
    </div>`;
}

async function render() {
  renderAuthArea();
  renderTabs();
  const view = document.getElementById('view');

  // ----- listing detail route -----
  if (state.route.name === 'listing') {
    let listing = state.listings.find(l => l.id === state.route.listingId);
    if (!listing) {
      // deep link / refresh: listing might not be loaded yet — fetch directly
      view.innerHTML = `<div class="empty"><h3>Loading…</h3></div>`;
      try {
        const all = await api('/listings/', {auth:false});
        state.listings = all || [];
        listing = state.listings.find(l => l.id === state.route.listingId);
      } catch {}
    }
    if (!listing) {
      view.innerHTML = `<div class="empty"><h3>Listing not found</h3><p>It may have been removed.</p>
        <button class="btn btn-primary" id="home">Back to all stays</button></div>`;
      view.querySelector('#home').onclick = () => go({name:'home', listingId:null});
      return;
    }
    await renderListingDetail(view, listing);
    return;
  }

  // ----- home route -----
  if (state.tab === 'explore') {
    view.innerHTML = `
      <div class="head"><div><h1>Places to stay</h1>
        <p>${state.listings.length ? state.listings.length + ' places from hosts' : 'Available places will show up here'}</p></div></div>
      ${state.loading && !state.listings.length ? skeletonGrid()
        : state.listings.length ? `<div class="grid">${state.listings.map(listingCard).join('')}</div>`
          : `<div class="empty"><h3>Nothing here yet</h3><p>No one has listed a place. Be the first.</p>
             <button class="btn btn-primary" data-new>Add a listing</button></div>`}`;
  }
  if (state.tab === 'mine') {
    const mine = state.listings.filter(l => state.me && l.owner.id === state.me.id);
    view.innerHTML = `
      <div class="head"><div><h1>Your listings</h1><p>Places you host</p></div>
        <div class="spacer"></div><button class="btn btn-primary" data-new>Add a listing</button></div>
      ${mine.length ? `<div class="grid">${mine.map(listingCard).join('')}</div>`
        : `<div class="empty"><h3>You aren't hosting yet</h3><p>Add a place and guests will see it on the home page.</p>
           <button class="btn btn-primary" data-new>Add a listing</button></div>`}`;
  }
  if (state.tab === 'trips') {
    view.innerHTML = `<div class="head"><div><h1>Your trips</h1><p>Requests you sent to hosts</p></div></div>
      ${state.tripsGuest.length ? state.tripsGuest.map(b => bookingRow(b, 'guest')).join('')
        : `<div class="empty"><h3>No trips yet</h3><p>Pick a place and send the host a request.</p>
           <button class="btn btn-primary" data-go-explore>Explore stays</button></div>`}`;
  }
  if (state.tab === 'inbox') {
    view.innerHTML = `<div class="head"><div><h1>Requests</h1><p>Confirm or decline bookings on your places</p></div></div>
      ${state.tripsOwner.length ? state.tripsOwner.map(b => bookingRow(b, 'owner')).join('')
        : `<div class="empty"><h3>No requests</h3><p>Bookings on your listings will show up here.</p></div>`}`;
  }

  wire(view);
}

function wire(root) {
  root.querySelectorAll('[data-listing]').forEach(card => card.onclick = (e) => {
    if (e.target.closest('button')) return;
    go({name:'listing', listingId: Number(card.dataset.listing)});
  });
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go({name:'listing', listingId: Number(b.dataset.open)}));
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => listingModal(state.listings.find(l => l.id == b.dataset.edit)));
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteListing(b.dataset.del));
  root.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { if (requireAuth()) listingModal(); });
  root.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => confirmBooking(b.dataset.confirm));
  root.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => rejectBooking(b.dataset.reject));
  root.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelBooking(b.dataset.cancel));
  root.querySelectorAll('[data-go-explore]').forEach(b => b.onclick = () => { state.tab = 'explore'; render(); });
}

document.getElementById('logo').onclick = () => { state.tab = 'explore'; go({name:'home', listingId:null}); };

/* ============ start ============ */
(async () => {
  state.route = parseLocation();          // read URL on first load (deep-link support)
  history.replaceState(state.route, '', location.pathname);
  await loadMe();
  await refresh();
})();
</script>
